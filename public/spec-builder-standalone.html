<style>:root{--bg:#faf7f1;--card:#fff;--ink:#2b2a27;--mute:#6b6458;--line:#e6dccb;--brand:#8f6a2a;--ok:#6a9f0a;--bad:#d64545}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;color:var(--brand)}
.brand img{height:48px;width:auto}
.brand small{display:block;font-weight:400;font-size:12px;color:#555}
.top{border-bottom:3px solid var(--ok)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.danger{color:var(--bad)}
button.ghost:hover{background:#f3ece0}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px;max-width:1500px;margin:auto}
nav{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:4px}
nav button{text-align:start;display:flex;justify-content:space-between;align-items:center;border:1px solid transparent;background:transparent}
nav button.on{background:var(--card);border-color:var(--line);font-weight:600}
nav .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
nav .dot.done{background:var(--ok)}
nav .prog{height:6px;background:var(--line);border-radius:3px;margin:6px 4px 10px;overflow:hidden}
nav .prog i{display:block;height:100%;background:var(--ok)}
main,aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
main h2{margin-top:0}
.hint{color:var(--mute);font-size:14px;margin:-4px 0 16px}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:14px}
input[type=text],textarea,select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid #e0c997;border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;gap:6px;align-items:center;margin:0;font-weight:400;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.chips input:checked+span{font-weight:700;color:var(--brand)}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fdfaf4}
.item .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item .head{display:flex;justify-content:space-between;align-items:center}
.item .head b{color:var(--mute);font-size:13px}
.item button{padding:3px 8px;font-size:13px}
.addbtn{margin-top:6px;border-style:dashed;color:var(--brand)}
.step-nav{display:flex;justify-content:space-between;margin-top:24px}
aside{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:14px}
aside h1{font-size:22px;margin-top:0}
aside h2{font-size:17px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:22px}
aside h3{font-size:15px;margin-bottom:2px}
aside table{border-collapse:collapse;width:100%}
aside th,aside td{border:1px solid var(--line);padding:4px 8px;text-align:start;vertical-align:top}
aside .empty{color:var(--mute)}
@media(max-width:1100px){.layout{grid-template-columns:1fr}nav{position:static;flex-direction:row;flex-wrap:wrap}nav .prog{width:100%}aside{position:static;max-height:none}}
@media print{.top,nav,main{display:none!important}body{background:#fff}.layout{display:block;padding:0}aside{border:0;max-height:none;position:static;padding:0;font-size:12pt}}

/* ---- site generator ---- */
button.build{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
#gen{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto 1fr}
#gen.open{display:grid}
#gen .gbar{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--ok)}
#gen .gbar b{margin-inline-end:auto;color:var(--brand)}
#gen .stage{display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px;background:#ece6da}
#gen iframe{width:100%;height:100%;min-height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff;transition:width .2s}
#gen iframe.mobile{width:390px}
#gen .side{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--card);border-inline-start:1px solid var(--line);overflow:auto}
#gen .log{flex:1;overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:8px}
#gen .msg{padding:8px 10px;border-radius:10px;background:#f3ece0}
#gen .msg.me{background:#e8f2d4}
#gen .msg.err{background:#fbe3e3;color:#8a1f1f}
#gen .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(250,247,241,.85);z-index:2}
#gen .overlay.on{display:flex}
#gen .spin{width:42px;height:42px;border:5px solid var(--line);border-top-color:var(--ok);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#gen .stage{position:relative}
#gen details{font-size:13px}
@media(max-width:900px){#gen.open{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}#gen .side{border-inline-start:0;border-top:1px solid var(--line);max-height:42vh}}
</style>
</head>

  var h='<label>'+esc(f.l)+'</label>';
  if(f.t==='text')h+='<input type="text"'+id+ph+' value="'+esc(val)+'">';
  else if(f.t==='area')h+='<textarea'+id+ph+'>'+esc(val)+'</textarea>';
  else if(f.t==='select'){h+='<select'+id+'><option value="">— בחר —</option>'+f.o.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
  else if(f.t==='chips'){var a=Array.isArray(val)?val:[];h+='<div class="chips">'+f.o.map(function(o){return '<label><input type="checkbox" data-c="'+path+'" value="'+esc(o)+'"'+(a.indexOf(o)>-1?' checked':'')+'><span>'+esc(o)+'</span></label>'}).join('')+'</div>'}
  return h;
}
function renderEditor(){
  var s=SECTIONS[cur];
  var h='<h2>'+(cur+1)+'. '+esc(s.title)+'</h2><p class="hint">'+esc(s.hint)+'</p>';
  s.fields.forEach(function(f){
    if(f.t!=='list'){h+=fieldHtml(f,state[f.k],f.k);return}
    h+='<label>'+esc(f.l)+'</label>';
    var arr=state[f.k]||[];
    arr.forEach(function(it,i){
      h+='<div class="item"><div class="head"><b>'+esc(f.name)+' '+(i+1)+'</b><button data-del="'+f.k+':'+i+'">מחק</button></div><div class="row">';
      f.f.forEach(function(sf){
        h+='<div style="'+(sf.full?'grid-column:1/-1':'')+'">'+fieldHtml(sf,it[sf.k],f.k+'.'+i+'.'+sf.k)+'</div>';
      });
      h+='</div></div>';
    });
    h+='<button class="addbtn" data-add="'+f.k+'">+ '+esc(f.add)+'</button>';
  });
  h+='<div class="step-nav"><button data-go="-1"'+(cur===0?' disabled':'')+'>→ הקודם</button><button class="primary" data-go="1"'+(cur===SECTIONS.length-1?' disabled':'')+'>הבא ←</button></div>';
  $('#editor').innerHTML=h;
}

// ---- Preview + Markdown
function lines(v){return String(v||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)}
function buildDoc(){
  // returns array of blocks: {h1|h2|h3|p|ul|table}
  var b=[],S=state;
  b.push({h1:S.name||'אפיון אתר ללא שם'});
  if(S.type)b.push({p:'סוג: '+S.type});
  var d=new Date().toLocaleDateString('he-IL');b.push({p:'תאריך: '+d});
  SECTIONS.forEach(function(sec){
    if(!secDone(sec))return;
    b.push({h2:sec.title});
    sec.fields.forEach(function(f){
      var v=S[f.k];if(!filled(v)||f.k==='name'||f.k==='type')return;
      if(f.t==='list'){
        if(f.k==='phases'){
          b.push({h3:f.l});b.push({table:[f.f.map(function(x){return x.l})].concat(v.map(function(it){return f.f.map(function(x){return it[x.k]||''})}))});
        }else if(f.k==='personas'){
          b.push({h3:f.l});b.push({table:[f.f.map(function(x){return x.l})].concat(v.map(function(it){return f.f.map(function(x){return it[x.k]||''})}))});
        }else{
          b.push({h3:f.l});
          v.forEach(function(it){
            b.push({h4:(it.n||'(ללא שם)')+(it.pri?' — '+it.pri:'')+(it.url?' — '+it.url:'')});
            var meta=[];if(it.purpose)meta.push('מטרה: '+it.purpose);if(it.access)meta.push('גישה: '+it.access);
            if(meta.length)b.push({p:meta.join(' · ')});
            if(it.content)b.push({p:it.content});if(it.d)b.push({p:it.d});
          });
        }
      }else if(f.t==='chips'){b.push({h3:f.l});b.push({ul:v})}
      else if(f.t==='area'&&lines(v).length>1){b.push({h3:f.l});b.push({ul:lines(v)})}
      else{b.push({h3:f.l});b.push({p:v})}
    });
  });
  return b;
}
function toHtml(b){
  return b.map(function(x){
    if(x.h1)return '<h1>'+esc(x.h1)+'</h1>';
    if(x.h2)return '<h2>'+esc(x.h2)+'</h2>';
    if(x.h3)return '<h3>'+esc(x.h3)+'</h3>';
    if(x.h4)return '<h4>'+esc(x.h4)+'</h4>';
    if(x.p)return '<p>'+esc(x.p).replace(/\n/g,'<br>')+'</p>';
    if(x.ul)return '<ul>'+x.ul.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>';
    if(x.table)return '<table><thead><tr>'+x.table[0].map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+x.table.slice(1).map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';
    return '';
  }).join('');
}
function toMd(b){
  return b.map(function(x){
    if(x.h1)return '# '+x.h1;if(x.h2)return '## '+x.h2;if(x.h3)return '### '+x.h3;if(x.h4)return '#### '+x.h4;
    if(x.p)return x.p;
    if(x.ul)return x.ul.map(function(i){return '- '+i}).join('\n');
    if(x.table){var t=x.table,hd='| '+t[0].join(' | ')+' |',sp='|'+t[0].map(function(){return '---'}).join('|')+'|';
      return [hd,sp].concat(t.slice(1).map(function(r){return '| '+r.map(function(c){return String(c).replace(/\|/g,'/').replace(/\n/g,' ')}).join(' | ')+' |'})).join('\n')}
    return '';
  }).join('\n\n')+'\n';
}
function renderPreview(){
  var b=buildDoc();
  $('#preview').innerHTML=Object.keys(state).some(function(k){return filled(state[k])})?toHtml(b):'<p class="empty">התצוגה המקדימה של מסמך האפיון תופיע כאן בזמן שתמלא את השלבים.</p>';
}

// ---- State updates
function setPath(path,val){
  var p=path.split('.');
  if(p.length===1){state[p[0]]=val;return}
  var arr=state[p[0]]=state[p[0]]||[];var it=arr[+p[1]]=arr[+p[1]]||{};it[p[2]]=val;
}
function refresh(full){save();renderNav();renderPreview();if(full)renderEditor()}

document.addEventListener('input',function(e){
  var t=e.target;if(t.dataset&&t.dataset.p){setPath(t.dataset.p,t.value);refresh(false)}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.c){var a=(state[t.dataset.c]||[]).slice(),i=a.indexOf(t.value);if(t.checked&&i<0)a.push(t.value);if(!t.checked&&i>-1)a.splice(i,1);state[t.dataset.c]=a;refresh(false)}
  else if(t.dataset&&t.dataset.p){setPath(t.dataset.p,t.value);refresh(false)}
});
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.parentNode.id==='nav'){cur=+t.dataset.i;renderNav();renderEditor();return}
  if(t.dataset.go){cur=Math.max(0,Math.min(SECTIONS.length-1,cur+ +t.dataset.go));renderNav();renderEditor();window.scrollTo(0,0);return}
  if(t.dataset.add){(state[t.dataset.add]=state[t.dataset.add]||[]).push({});refresh(true);return}
  if(t.dataset.del){var p=t.dataset.del.split(':');state[p[0]].splice(+p[1],1);refresh(true)}
});

// ---- Toolbar
function download(name,text,mime){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},500)}
function fname(){return (state.name||'website-spec').replace(/[^\w֐-׿-]+/g,'_')}
$('#btnMd').onclick=function(){download(fname()+'.md',toMd(buildDoc()),'text/markdown')};
$('#btnJson').onclick=function(){download(fname()+'.json',JSON.stringify(state,null,2),'application/json')};
$('#btnPrint').onclick=function(){window.print()};
$('#btnImport').onclick=function(){$('#fileIn').click()};
$('#fileIn').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;state=o;refresh(true)}catch(x){alert('קובץ JSON לא תקין')}};
  r.readAsText(f);e.target.value='';
};
$('#btnReset').onclick=function(){if(confirm('למחוק את כל האפיון?')){state={};cur=0;refresh(true)}};
$('#btnSample').onclick=function(){
  if(Object.keys(state).length&&!confirm('טעינת הדוגמה תחליף את התוכן הנוכחי. להמשיך?'))return;
  state=SAMPLE();cur=0;refresh(true);
};
function SAMPLE(){return {
 name:'מאסטר־שף — אתר קורסי בישול',type:'אתר תדמית',
 desc:'אתר שיווקי ורישום לקורסי בישול למתחילים ולמתקדמים, עם אפשרות הזמנת סדנאות פרטיות.',
 goals:'להגדיל רישום לקורסים\nלבנות רשימת דיוור\nלהציג סדנאות לחברות',kpis:'300 נרשמים לקורס בחודש\nשיעור המרה 4%\n1,000 מנויים לניוזלטר ברבעון',
 personas:[{n:'דנה, 32, מתחילה',need:'ללמוד בישול בסיסי אחרי העבודה',pain:'חוסר זמן ופחד מכישלון',dev:'מובייל'},{n:'רוני, מנהל HR',need:'סדנת גיבוש לצוות',pain:'קושי להשוות מחירים ותאריכים',dev:'דסקטופ'}],
 langs:['עברית','אנגלית'],
 pages:[{n:'בית',url:'/',purpose:'להסביר את ההצעה ולהוביל להרשמה',access:'ציבורי',content:'תמונת גיבור, 3 קורסים מובילים, המלצות, כפתור הרשמה'},{n:'קורסים',url:'/courses',purpose:'השוואה וסינון קורסים',access:'ציבורי',content:'רשימה עם סינון לפי רמה ותאריך, כרטיס קורס'},{n:'סדנאות לחברות',url:'/corporate',purpose:'יצירת לידים עסקיים',access:'ציבורי',content:'חבילות, גלריה, טופס בקשת הצעת מחיר'},{n:'האזור שלי',url:'/account',purpose:'ניהול הרשמות',access:'משתמש רשום',content:'הקורסים שלי, חשבוניות'}],
 nav:'תפריט ראשי: בית, קורסים, סדנאות לחברות, אודות, צור קשר. תחתית: תקנון, פרטיות, נגישות.',
 features:[{n:'הרשמה ותשלום לקורס',pri:'חובה (Must)',d:'בחירת מועד, תשלום באשראי, אישור במייל. קבלה: הרשמה מושלמת תוך פחות מ־2 דקות.'},{n:'רשימת המתנה',pri:'רצוי (Should)',d:'כשהקורס מלא, המשתמש מצטרף לרשימה ומקבל הודעה כשמתפנה מקום.'},{n:'בלוג מתכונים',pri:'נחמד (Could)',d:'מאמרים לקידום אורגני.'}],

 tone:['חם ואנושי','צעיר ושובב'],colors:'#E4572E כתום ראשי, #2E4057 כחול כהה, #FFF8F0 רקע',fonts:'Heebo לכל האתר',refs:'masterchef.co.il, skillshare.com',a11y:'WCAG 2.1 AA (תקן ישראלי 5568)',responsive:['מובייל','דסקטופ'],
 stack:'אתר סטטי + פונקציות שרת (Netlify)',hosting:'Netlify, דומיין .co.il',integr:['תשלומים (Stripe/PayPal)','דוא״ל (Resend/Mailchimp)','Google Analytics','וואטסאפ'],
 db:'פרטי נרשמים ותשלומים ב־Firestore, ללא שמירת פרטי אשראי.',seo:'מילות מפתח: קורס בישול, סדנת בישול. LCP < 2.5s. sitemap.xml.',sec:'HTTPS, הרשאות לפי משתמש, גיבוי יומי.',
 contentOwner:'צילום מנות וטקסטים — השפית. תרגום לאנגלית — חיצוני.',legal:['תנאי שימוש','מדיניות פרטיות','הצהרת נגישות','מדיניות החזרים'],
 phases:[{n:'אפיון ועיצוב',dur:'3 שבועות',out:'מסמך אפיון + מוקאפים'},{n:'פיתוח',dur:'5 שבועות',out:'אתר בסביבת בדיקות'},{n:'בדיקות והשקה',dur:'שבועיים',out:'אתר חי'}],
 budget:'35,000–45,000 ₪',launch:'תחילת הרבעון הבא',risks:'עיכוב בתוכן מהלקוח\nשינויי דרישות באמצע פיתוח',outscope:'אפליקציית מובייל\nמערכת חברות מועדון'};}

window.SpecBuilder={getSpec:function(){return JSON.parse(JSON.stringify(state))},hasContent:function(){return Object.keys(state).some(function(k){return filled(state[k])})}};
renderNav();renderEditor();renderPreview();
})();

<script>/* Site generator UI: sends the spec to the server function (Claude builds the
   site), shows the result in an iframe, and lets the user refine it by chat. */
(function(){
'use strict';
var DEFAULT_BASE='/.netlify/functions/';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rid(){var a=new Uint8Array(12);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(x){return x.toString(16).padStart(2,'0')}).join('')}

var root=document.createElement('div');root.id='gen';
root.innerHTML=
 '<div class="gbar"><b>✨ בניית האתר</b>'+
 '<button data-a="undo" disabled>↶ גרסה קודמת</button>'+
 '<button data-a="device">📱 / 🖥️</button>'+
 '<button data-a="dl" disabled>הורד HTML</button>'+
 '<button data-a="open" disabled>פתח בלשונית</button>'+
 '<button data-a="close">סגור</button></div>'+
 '<div class="stage"><div class="overlay"><div class="spin"></div><div class="otxt">בונה את האתר…</div></div><iframe title="תצוגת האתר" sandbox="allow-scripts allow-forms allow-popups"></iframe></div>'+
 '<div class="side"><div class="log"></div>'+
 '<textarea placeholder="מה לשנות? למשל: תהפוך את הכותרת לגדולה יותר, תוסיף עמוד מחירים…"></textarea>'+
 '<button class="primary" data-a="send">שלח</button>'+
 '<details><summary>הגדרות שרת</summary>'+
 '<label>כתובת פונקציות</label><input type="text" id="gBase">'+
 '<label>קוד גישה (אם הוגדר)</label><input type="text" id="gKey"></details></div>';
document.body.appendChild(root);

var $=function(s){return root.querySelector(s)}, frame=$('iframe'), log=$('.log'), ta=$('textarea');
var versions=[], busy=false, timer=null;
$('#gBase').value=ls('sb.server')||DEFAULT_BASE;$('#gKey').value=ls('sb.key')||'';
$('#gBase').oninput=function(){ls('sb.server',this.value)};$('#gKey').oninput=function(){ls('sb.key',this.value)};

function say(t,c){var d=document.createElement('div');d.className='msg '+(c||'');d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function base(){var b=($('#gBase').value||DEFAULT_BASE).trim();return b.slice(-1)==='/'?b:b+'/'}
function cur(){return versions[versions.length-1]||null}
function show(){var h=cur();frame.srcdoc=h||'';['undo','dl','open'].forEach(function(a){root.querySelector('[data-a='+a+']').disabled=!h||(a==='undo'&&versions.length<2)})}
function overlay(on,t){var o=$('.overlay');o.classList.toggle('on',on);if(t)$('.otxt').textContent=t}

function run(instruction){
  if(busy)return;
  var spec=window.SpecBuilder.getSpec(),html=cur(),id=rid(),key=$('#gKey').value.trim();
  busy=true;var t0=Date.now();
  overlay(true,'בונה את האתר…');
  clearInterval(timer);timer=setInterval(function(){$('.otxt').textContent=(html?'מעדכן':'בונה')+' את האתר… '+Math.round((Date.now()-t0)/1000)+' שניות'},1000);
  var done=function(){busy=false;clearInterval(timer);overlay(false)};
  fetch(base()+'site-builder-background',{method:'POST',mode:'no-cors',headers:{'content-type':'text/plain'},
    body:JSON.stringify({id:id,key:key||undefined,spec:spec,instruction:instruction||undefined,html:html||undefined})
  }).then(function(){poll(id,key,t0,done)}).catch(function(){done();say('לא הצלחתי להגיע לשרת. בדוק את כתובת הפונקציות בהגדרות.','err')});
}
function poll(id,key,t0,done){
  if(Date.now()-t0>14*60*1000){done();say('הבנייה לוקחת יותר מדי זמן. נסה שוב.','err');return}
  setTimeout(function(){
    fetch(base()+'site-builder-status?id='+id+(key?'&key='+encodeURIComponent(key):'')).then(function(r){
      if(r.status===404)throw new Error('הפונקציות לא נמצאו בכתובת שהוגדרה (404). האתר צריך להיות מפורסם ב-Netlify.');
      return r.json()}).then(function(j){
      if(j.status==='pending')return poll(id,key,t0,done);
      done();
      if(j.status==='done'){versions.push(j.html);if(versions.length>8)versions.shift();show();say('האתר מוכן. אפשר לבקש שינויים.')}
      else say(j.error||'שגיאה לא ידועה','err');
    }).catch(function(e){done();say(e.message||'שגיאת רשת','err')});
  },3000);
}

function send(){var v=ta.value.trim();if(!v&&cur())return;if(v)say(v,'me');ta.value='';run(v)}
root.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var a=b.dataset.a;
  if(a==='close')root.classList.remove('open');
  else if(a==='send')send();
  else if(a==='device')frame.classList.toggle('mobile');
  else if(a==='undo'&&versions.length>1){versions.pop();show();say('חזרתי לגרסה הקודמת.')}
  else if(a==='dl'&&cur()){var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([cur()],{type:'text/html'}));l.download='index.html';document.body.appendChild(l);l.click();l.remove()}
  else if(a==='open'&&cur()){var w=window.open();if(w){w.document.open();w.document.write(cur());w.document.close()}}
});
ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))send()});

document.getElementById('btnBuild').onclick=function(){
  if(!window.SpecBuilder.hasContent()){alert('מלא קודם לפחות חלק מהאפיון (או לחץ "טען דוגמה").');return}
  root.classList.add('open');
  if(!versions.length&&!busy){say('שולח את האפיון ל-Claude. זה לוקח בדרך כלל דקה עד שלוש.');run()}
};
})();
</script>
